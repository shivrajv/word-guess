<!DOCTYPE html>
<!-- Tells the browser this is a modern HTML5 document. -->
<html lang="en">
<head>
  <!-- Character encoding: UTF-8 lets us use emojis and any language. -->
  <meta charset="UTF-8" />
  <!-- Makes the page scale correctly on phones instead of looking zoomed out. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The text shown in the browser tab. -->
  <title>Word Guess — Emoji Edition</title>

  <!-- Everything between <style> and </style> is CSS: it controls how the page LOOKS. -->
  <style>
    /* CSS variables: reusable values (mostly colors) defined once here and
       reused below with var(--name). Change a color once, it updates everywhere. */
    :root {
      --bg: #f7f8fc;         /* page background (very light grey) */
      --card: #ffffff;       /* the white emoji card */
      --ink: #1f2430;        /* main text color (near-black) */
      --muted: #7b8494;      /* dimmed text (hints, counter) */
      --accent: #6366f1;     /* brand purple used on buttons */
      --accent-ink: #ffffff; /* text color on top of the purple */
      --shadow: 0 12px 40px rgba(31, 36, 48, 0.10); /* soft drop shadow */
    }

    /* box-sizing: border-box makes an element's width/height include its padding
       and border, which makes sizing far more predictable. * = every element. */
    * { box-sizing: border-box; }

    /* Make the page fill the whole screen height and remove default margins. */
    html, body { height: 100%; margin: 0; }

    /* The body is a vertical stack (a flex column): word on top, flexible spacer
       in the middle, emoji clues at the bottom. */
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; /* slightly smoother text on some browsers */
    }

    /* ===== TOP AREA: the word being shown ===== */
    .word-zone {
      flex: 0 0 auto;                 /* take only as much height as its content needs */
      padding: 2.5rem 1.25rem 1.25rem;
      text-align: center;
    }
    /* Small uppercase label above the word ("GUESS THE EMOJIS"). */
    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    /* The big word itself. clamp(min, preferred, max) grows the font with screen
       width but never below 2.2rem or above 4rem. */
    .word {
      font-size: clamp(2.2rem, 9vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.05;
      word-break: break-word;         /* wrap very long words instead of overflowing */
    }

    /* ===== MIDDLE AREA: flexible spacer that also shows "Word N of 100" =====
       flex: 1 1 auto means this grows to fill the leftover space, which pushes
       the word to the top and the emoji clues to the bottom. */
    .middle {
      flex: 1 1 auto;
      display: flex;
      align-items: center;      /* center the counter text vertically */
      justify-content: center;  /* and horizontally */
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* ===== BOTTOM AREA: the emoji clue card and the buttons ===== */
    .emoji-zone {
      flex: 0 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    /* The white rounded card that holds the emoji clues. It's a flex row that
       wraps onto more lines (flex-wrap) once there are too many emojis to fit. */
    .emoji-card {
      max-width: 32rem;
      margin: 0 auto 1rem;             /* centered, with space below */
      background: var(--card);
      border-radius: 1.25rem;          /* rounded corners */
      box-shadow: var(--shadow);
      padding: 1.75rem 1rem;
      display: flex;
      flex-wrap: wrap;                 /* let emojis flow onto more rows */
      align-items: center;
      justify-content: center;
      gap: clamp(0.4rem, 3vw, 1.5rem); /* space between emojis */
    }
    .emoji {
      line-height: 1;
      user-select: none;               /* stop the emojis being text-selected on tap */
    }
    /* The emojis shrink as more are revealed so all 15 still fit. The JavaScript
       swaps the card between these three size classes (size-lg / md / sm). */
    .emoji-card.size-lg .emoji { font-size: clamp(3rem, 15vw, 5rem); }     /* 1–3 shown */
    .emoji-card.size-md .emoji { font-size: clamp(2.5rem, 10vw, 3.5rem); } /* 4–6 shown */
    .emoji-card.size-sm .emoji { font-size: clamp(1.9rem, 7vw, 2.75rem); } /* 7–15 shown */

    /* Row holding the "More emojis" button. min-height reserves the space so the
       layout doesn't jump when the button hides itself once all 15 are shown. */
    .more-wrap {
      max-width: 32rem;
      margin: 0 auto 1.25rem;
      display: flex;
      justify-content: center;
      min-height: 2.4rem;
    }
    /* The outlined "More emojis" button (purple border that fills in on hover). */
    .more-btn {
      appearance: none;                /* remove the browser's default button styling */
      cursor: pointer;
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.55rem 1.4rem;
      border-radius: 999px;            /* fully rounded "pill" shape */
      transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
    }
    .more-btn:hover { background: var(--accent); color: var(--accent-ink); } /* fill in on hover */
    .more-btn:active { transform: translateY(1px) scale(0.99); }             /* press-down effect */
    /* Row that centers the main "Next word" button. */
    .controls {
      max-width: 32rem;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    /* The solid purple "Next word" button. */
    .next-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 2.25rem;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      transition: transform 0.08s ease, box-shadow 0.15s ease;
    }
    .next-btn:hover { box-shadow: 0 10px 26px rgba(99, 102, 241, 0.45); } /* lift on hover */
    .next-btn:active { transform: translateY(1px) scale(0.99); }         /* press-down effect */
    /* Small grey helper text under the buttons. */
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 0.9rem;
    }
  </style>
</head>
<!-- The <body> is the visible page. Elements with an id="" are the ones the

<body>
  <!-- TOP: the word. #word starts empty (&nbsp; is just a blank space) and the
       JavaScript fills in the real word. -->
  <section class="word-zone">
    <div class="kicker">Guess the emojis</div>
    <h1 class="word" id="word">&nbsp;</h1>
  </section>

  <!-- MIDDLE: the JavaScript writes "Word N of 100" into here. -->
  <div class="middle" id="counter"></div>

  <!-- BOTTOM: the emoji clues and the two buttons. -->
  <section class="emoji-zone">
    <!-- #emojis is filled by the JavaScript with one <span> per revealed emoji. -->
    <div class="emoji-card size-lg" id="emojis"></div>

    <!-- "More emojis" button. The JavaScript shows/hides it and updates its label. -->
    <div class="more-wrap">
      <button class="more-btn" id="more" type="button">＋ More emojis</button>
    </div>

    <!-- "Next word" button: jumps to a new random word. -->
    <div class="controls">
      <button class="next-btn" id="next" type="button">Next word →</button>
    </div>

    <p class="hint">Tap “More emojis” for extra clues · “Next word” or Space for a new word</p>
  </section>

      { w: "Happy",       e: ["😀","😄","😁","😊","🥳","😃","🙂","😸","🌈","☀️","🎉","👍","😆","🤗","💛"] },
      { w: "Angry",       e: ["😠","😡","🤬","💢","👿","🔥","😤","🌋","🗯️","✊","💥","😾","🖤","⚡","🥊"] },
      { w: "Sleep",       e: ["😴","💤","🛏️","🌙","🛌","🥱","🌛","🧸","🌃","⏰","🦉","🌟","🛋️","🕯️","🌜"] },
      { w: "Ghost",       e: ["👻","💀","🎃","🕸️","🏚️","😱","⚰️","🌫️","🕯️","🔮","🪦","🦇","😨","🌙","🫥"] },
      { w: "Magic",       e: ["🪄","✨","🧙","🔮","🎩","🐇","🌟","🃏","🧚","💫","🕯️","🧿","🌈","🦄","🎆"] },
    ];

    // ===== GRAB THE PAGE ELEMENTS =====
    // document.getElementById("x") finds the element with id="x" in the HTML
    // above, so we can read or change it from JavaScript.
    const wordEl    = document.getElementById("word");    // the big word heading
    const emojisEl  = document.getElementById("emojis");  // the emoji card
    const counterEl = document.getElementById("counter"); // the "Word N of 100" text
    const nextBtn   = document.getElementById("next");    // the "Next word" button
    const moreBtn   = document.getElementById("more");    // the "More emojis" button

    // ===== SETTINGS (change these to tune the game) =====
    const START = 3;   // how many emojis show when a word first appears
    const STEP  = 3;   // how many more emojis each "More emojis" tap reveals

    // ===== GAME STATE (values that change as you play) =====
    // "let" (unlike "const") means the value can be reassigned later.
    let current  = -1;      // index of the word being shown (-1 = none yet)
    let shuffled = [];      // the current word's 15 emojis, in a shuffled order
    let revealed = START;   // how many of those emojis are currently visible

    // Return a shuffled COPY of an array (the original list is left untouched).
    // This is the Fisher–Yates shuffle: walk from the end, swapping each item
    // with a random earlier one. We shuffle so the first 3 emojis shown are
    // random each time, not always the same three.
    function shuffle(arr) {
      const a = arr.slice();                            // make a copy so we don't change WORDS
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));  // random index from 0 to i
        [a[i], a[j]] = [a[j], a[i]];                    // swap the two items
      }
      return a;
    }

    // Choose which emoji size to use based on how many are showing, so that more
    // emojis => smaller size and they still fit. Returns a CSS class name.
    function sizeClass(n) {
      if (n <= 3) return "size-lg";   // 1–3 emojis: big
      if (n <= 6) return "size-md";   // 4–6 emojis: medium
      return "size-sm";               // 7–15 emojis: small
    }

    // Redraw the emoji card and the "More emojis" button to match the current
    // state. Called any time something changes — this is the heart of the UI.
    function render() {
      // Set the card's size class (which controls emoji font size via the CSS).
      emojisEl.className = "emoji-card " + sizeClass(revealed);

      // Empty the card, then add one <span> for each emoji we want to show.
      emojisEl.innerHTML = "";
      shuffled.slice(0, revealed).forEach(function (em) { // take the first `revealed` emojis
        const span = document.createElement("span");
        span.className = "emoji";
        span.textContent = em;
        emojisEl.appendChild(span);                       // put it inside the card
      });

      // Update the "More emojis" button: show how many clues are left, or hide
      // the button entirely once every emoji has been revealed.
      const remaining = shuffled.length - revealed;
      if (remaining > 0) {
        moreBtn.style.display = "";                        // make sure it's visible
        moreBtn.textContent = "＋ More emojis (" + remaining + " left)";
      } else {
        moreBtn.style.display = "none";                    // all 15 shown → hide it
      }

      // Update the "Word N of 100" counter (current is 0-based, so we add 1).
      counterEl.textContent = "Word " + (current + 1) + " of " + WORDS.length;
    }

    // Pick a new random word and reset the clues back to 3. Runs when you press
    // "Next word" (or the Space key), and once automatically at startup.
    function nextWord() {
      // Pick a random position in the WORDS list...
      let idx = Math.floor(Math.random() * WORDS.length);
      // ...but if we happened to pick the word we're already on, pick again.
      if (WORDS.length > 1) {
        while (idx === current) idx = Math.floor(Math.random() * WORDS.length);
      }
      current = idx;
      wordEl.textContent = WORDS[idx].w;   // show the new word at the top
      shuffled = shuffle(WORDS[idx].e);    // shuffle that word's 15 emojis
      revealed = START;                    // start by showing just 3 of them
      render();                            // draw everything
    }

    // Reveal STEP (3) more emojis for the current word, but never more than the
    // 15 that exist. Runs when you tap "More emojis".
    function moreEmojis() {
      revealed = Math.min(revealed + STEP, shuffled.length);
      render();
    }

    // ===== HOOK THE BUTTONS UP =====
    // addEventListener("click", fn) means "run function fn whenever this is clicked".
    nextBtn.addEventListener("click", nextWord);
    moreBtn.addEventListener("click", moreEmojis);

    // Also let the Space key trigger "Next word". e.preventDefault() stops the
    // page from also scrolling down when Space is pressed.
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.key === " ") {
        e.preventDefault();
        nextWord();
      }
    });

    // ===== START THE GAME =====
    // Show the first word right away when the page finishes loading.
    nextWord();

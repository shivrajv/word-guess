<!DOCTYPE html>
<!-- Tells the browser this is a modern HTML5 document. -->
<html lang="en">
<head>
  <!-- Character encoding: UTF-8 lets us use emojis and any language. -->
  <meta charset="UTF-8" />
  <!-- Makes the page scale correctly on phones instead of looking zoomed out. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tell the browser not to cache this page, so reloading always gets the
       latest version (avoids showing a stale build after an update). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- The text shown in the browser tab. -->
  <title>Word Guess — Emoji Edition</title>
  <!-- build-marker: version-badge-v2 -->  <!-- bump to force a fresh GitHub Pages rebuild -->


  <!-- Everything between <style> and </style> is CSS: it controls how the page LOOKS. -->
  <style>
    /* CSS variables: reusable values (mostly colors) defined once here and
       reused below with var(--name). Change a color once, it updates everywhere. */
    :root {
      --bg: #f7f8fc;         /* page background (very light grey) */
      --card: #ffffff;       /* the white emoji card */
      --ink: #1f2430;        /* main text color (near-black) */
      --muted: #7b8494;      /* dimmed text (hints, counter) */
      --accent: #6366f1;     /* brand purple used on buttons */
      --accent-ink: #ffffff; /* text color on top of the purple */
      --good: #16a34a;       /* green = correct answer */
      --good-bg: #dcfce7;    /* light green fill for the correct option */
      --bad: #dc2626;        /* red = wrong answer */
      --bad-bg: #fee2e2;     /* light red fill for a wrong pick */
      --shadow: 0 12px 40px rgba(31, 36, 48, 0.10); /* soft drop shadow */
    }

    /* box-sizing: border-box makes an element's width/height include its padding
       and border, which makes sizing far more predictable. * = every element. */
    * { box-sizing: border-box; }

    /* Make the page fill the whole screen height and remove default margins. */
    html, body { height: 100%; margin: 0; }

    /* The body is a vertical stack (a flex column): word on top, flexible spacer
       in the middle, emoji clues at the bottom. */
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; /* slightly smoother text on some browsers */
    }

    /* Subtle visitor counter at the very top: kept small and faded so it doesn't
       compete with the game. Whatever the third-party script renders (image/text)
       is shrunk to fit this strip. */
    .visitor-counter {
      flex: 0 0 auto;
      text-align: center;
      padding: 3px 0 0;
      opacity: 0.4;
      font-size: 0.6rem;
      line-height: 1;
      color: var(--muted);
    }
    .visitor-counter img { height: 11px; width: auto; vertical-align: middle; }
    .visitor-counter a { color: var(--muted); text-decoration: none; }

    /* ===== TOP BAR: score on the left, app name centered, timer on the right ===== */
    .topbar {
      flex: 0 0 auto;
      position: relative;              /* lets the HUD sit absolutely on the left */
      text-align: center;
      padding: 1.25rem 1rem 0.25rem;
    }
    .appname {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    /* The score (top-left) and the timer (top-right), slightly enlarged. */
    .hud-stat {
      position: absolute;
      top: 1rem;
      font-size: 1.15rem;                /* enlarged from 0.95rem */
      font-weight: 800;
    }
    .hud-left  { left: 0.95rem; }
    .hud-right { right: 0.95rem; }
    #score { color: var(--accent); }     /* points in purple */
    #timer { color: var(--ink); }
    #timer.low { color: var(--bad); }    /* clock turns red in the last few seconds */

    /* The two-bar pause icon used inside the bottom "Pause" button. currentColor
       makes the bars match the button's text color (and flip on hover). */
    .pbars { display: inline-flex; gap: 3px; vertical-align: -2px; margin-right: 7px; }
    .pbars span { display: block; width: 4px; height: 13px; border-radius: 2px; background: currentColor; }

    /* ===== BOTTOM AREA: the answer buttons + controls (kept low for thumb reach) ===== */
    .answer-zone {
      flex: 0 0 auto;                 /* take only as much height as its content needs */
      /* bottom padding keeps the buttons where they were before the caption was
         removed, and leaves room for the Hint callout below the button. */
      padding: 0.5rem 1.25rem 5rem;
      text-align: center;
    }
    /* Small uppercase label above the choices ("WHICH WORD..."). */
    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    /* The four choices, laid out in a 2x2 grid. */
    .options {
      max-width: 32rem;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr; /* two equal columns => 2x2 for four buttons */
      gap: 0.75rem;
    }
    /* One answer choice: a pill-shaped ("circle"-style) button, white with a border. */
    .option {
      appearance: none;
      cursor: pointer;
      background: var(--card);
      color: var(--ink);
      border: 2px solid #e5e7f0;
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      font-weight: 700;
      padding: 0.95rem 0.75rem;
      border-radius: 999px;           /* fully rounded */
      box-shadow: var(--shadow);
      transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
      word-break: break-word;
    }
    .option:not(:disabled):hover  { border-color: var(--accent); }
    .option:not(:disabled):active { transform: translateY(1px) scale(0.99); }
    /* After answering, the JavaScript adds one of these to color the buttons. */
    .option.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); }
    .option.wrong   { background: var(--bad-bg);  border-color: var(--bad);  color: var(--bad); }
    /* Options that were neither the answer nor your pick fade out once disabled. */
    .option:disabled { cursor: default; opacity: 0.5; }
    .option.correct:disabled, .option.wrong:disabled { opacity: 1; } /* keep colored ones bold */

    /* ===== MIDDLE AREA: flexible spacer between the emojis (top) and the answer
       buttons (bottom). The ✓/✗ badge was removed — right vs wrong now shows only
       as the green/red coloring on the answer buttons. ===== */
    .mark-zone {
      flex: 1 1 auto;
      min-height: 4.5rem;
    }

    /* The play area is everything below the top bar (the emoji stage + the answer
       buttons). position: relative lets the Paused card cover this whole area. */
    .play-area {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    /* The stage holds the emoji clues + the marker. */
    .stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ===== TOP AREA: the emoji clue card ===== */
    .clue-zone {
      flex: 0 0 auto;
      padding: 1.5rem 1.25rem 0.5rem;
    }
    /* The white rounded card that holds the emoji clues. It's a flex row that
       wraps onto more lines (flex-wrap) once there are too many emojis to fit. */
    .emoji-card {
      max-width: 32rem;
      margin: 0 auto 1rem;             /* centered, with space below */
      background: var(--card);
      border-radius: 1.25rem;          /* rounded corners */
      box-shadow: var(--shadow);
      padding: 1.75rem 1rem;
      display: flex;
      flex-wrap: wrap;                 /* let emojis flow onto more rows */
      align-items: center;
      justify-content: center;
      gap: clamp(0.4rem, 3vw, 1.5rem); /* space between emojis */
    }
    .emoji {
      line-height: 1;
      user-select: none;               /* stop the emojis being text-selected on tap */
    }
    /* The emojis shrink as more are revealed so all 15 still fit. The JavaScript
       swaps the card between these three size classes (size-lg / md / sm). */
    .emoji-card.size-lg .emoji { font-size: clamp(3rem, 15vw, 5rem); }     /* 1–3 shown */
    .emoji-card.size-md .emoji { font-size: clamp(2.5rem, 10vw, 3.5rem); } /* 4–6 shown */
    .emoji-card.size-sm .emoji { font-size: clamp(1.9rem, 7vw, 2.75rem); } /* 7–15 shown */

    /* Row holding the "More emojis" button. min-height reserves the space so the
       layout doesn't jump when the button hides itself once all 15 are shown. */
    .more-wrap {
      max-width: 32rem;
      margin: 1.25rem auto 1.25rem;    /* space above so it isn't touching the word buttons */
      display: flex;
      justify-content: center;
      min-height: 2.4rem;
    }
    /* The outlined "More emojis" button (purple border that fills in on hover). */
    .more-btn {
      appearance: none;                /* remove the browser's default button styling */
      cursor: pointer;
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.55rem 1.4rem;
      border-radius: 999px;            /* fully rounded "pill" shape */
      transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
    }
    .more-btn:not(:disabled):hover  { background: var(--accent); color: var(--accent-ink); } /* fill in on hover */
    .more-btn:not(:disabled):active { transform: translateY(1px) scale(0.99); }             /* press-down effect */
    .more-btn:disabled { opacity: 0.4; cursor: default; }                    /* greyed out after answering */
    /* Row that centers the main "Next word" button. */
    .controls {
      max-width: 32rem;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    /* The solid purple "Next word" button. */
    .next-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 2.25rem;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      transition: transform 0.08s ease, box-shadow 0.15s ease;
    }
    .next-btn:not(:disabled):hover  { box-shadow: 0 10px 26px rgba(99, 102, 241, 0.45); } /* lift on hover */
    .next-btn:not(:disabled):active { transform: translateY(1px) scale(0.99); }           /* press-down effect */
    .next-btn:disabled { opacity: 0.4; box-shadow: none; cursor: default; }               /* off until you answer */
    /* Small grey helper text under the buttons. */
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 0.9rem;
    }

    /* ===== GAME OVER overlay: covers the whole screen when the timer hits 0 =====
       The [hidden] attribute keeps it off-screen until the JavaScript reveals it. */
    .gameover {
      position: fixed;
      inset: 0;                        /* shorthand for top/right/bottom/left: 0 */
      background: rgba(15, 18, 30, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 10;                     /* sit on top of everything else */
    }
    .gameover[hidden] { display: none; }   /* the hidden attribute wins over display:flex */
    .go-card {
      background: var(--card);
      border-radius: 1.25rem;
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 22rem;
      width: 100%;
    }
    .go-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .go-score { font-size: 1.1rem; color: var(--muted); margin-bottom: 1.75rem; }
    .go-score strong { color: var(--accent); font-size: 1.4rem; }

    /* ===== PAUSED card: one white rounded card that covers the whole play area
       (the emojis AND the word buttons) while paused. No dark box — just the card.
       Only its "Play" button is usable; the "Word Guess" bar stays visible above. */
    .pause-panel {
      position: absolute;
      inset: 0.5rem;                   /* fill the play area, leaving a small margin */
      background: var(--card);         /* white — this IS the card, no dark box */
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      z-index: 5;
    }
    .pause-panel[hidden] { display: none; }
    .pause-panel .go-title { margin: 0; }   /* "Paused" heading, reusing go-title */

    /* ===== TUTORIAL overlay: shown once when the page loads. A see-through dim
       layer blocks the game, and a small labelled arrow points at each part.
       "Got it" dismisses it and starts the clock. ===== */
    .tutorial {
      position: fixed;
      inset: 0;
      background: rgba(15, 18, 30, 0.55);   /* transparent dim that blocks everything */
      z-index: 60;
    }
    .tutorial[hidden] { display: none; }
    /* Each labelled callout. JS positions it next to its target. */
    .callout {
      position: fixed;
      z-index: 61;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.2;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      max-width: 42vw;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    /* The little triangle that points from a callout to its target. */
    .callout-arrow { position: absolute; width: 0; height: 0; border: 7px solid transparent; }
    .dir-below .callout-arrow { bottom: 100%; border-bottom-color: var(--accent); transform: translateX(-50%); }
    .dir-above .callout-arrow { top: 100%;    border-top-color: var(--accent);    transform: translateX(-50%); }
    .dir-left  .callout-arrow { left: 100%;   border-left-color: var(--accent);   transform: translateY(-50%); }
    .dir-right .callout-arrow { right: 100%;  border-right-color: var(--accent);  transform: translateY(-50%); }
    /* The "Got it" button that starts the game. */
    /* The "how to play" text in the middle of the tutorial. There's no button now
       — tapping anywhere on the overlay starts the game. */
    .tut-howto {
      position: fixed;
      left: 50%;
      top: 35%;                       /* upper-middle, clear of the callouts below */
      transform: translate(-50%, -50%);
      z-index: 62;
      width: min(85vw, 21rem);
      text-align: center;
      color: #fff;
      background: rgba(15, 18, 30, 0.55);   /* subtle backing so the text stays readable */
      border-radius: 1rem;
      padding: 0.9rem 1rem;
    }
    .tut-howto-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 0.35rem; }
    .tut-howto p { font-size: 0.8rem; line-height: 1.4; margin: 0 0 0.7rem; color: #e5e7f0; }
    .tut-tap { font-size: 0.95rem; font-weight: 800; animation: tapPulse 1.4s ease-in-out infinite; }
    @keyframes tapPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* Temporary visible version badge — a small green pill in the bottom-left,
       above everything, so you can confirm the page loaded the latest build. */
    .build-badge {
      position: fixed;
      left: 6px;
      bottom: 6px;
      z-index: 100;
      background: #16a34a;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      opacity: 0.9;
      pointer-events: none;   /* never blocks a tap */
    }
  </style>
</head>
<!-- The <body> is the visible page. Elements with an id="" are the ones the
     JavaScript at the bottom finds and updates while you play. -->
<body>
  <!-- Subtle third-party visitor counter (free-counters.org), at the very top and
       kept small/faded. Loaded synchronously so its output lands here. Only the
       counter is included — no ad link and no extra tracker. -->
  <div class="visitor-counter" aria-label="Visitor counter">
    <script type="text/javascript" src="https://www.free-counters.org/count/jzhz"></script>
  </div>

  <!-- Top bar: score on the left, app name centered, timer on the right.
       (The pause button moved down to the answer area.) -->
  <header class="topbar">
    <span id="score" class="hud-stat hud-left">★ 0</span>
    <div class="appname">Word Guess</div>
    <span id="timer" class="hud-stat hud-right">⏱ 30</span>
  </header>

  <!-- PLAY AREA: everything below the top bar (the emoji stage + the answer
       buttons). The Paused card covers all of it while paused. -->
  <div class="play-area">
    <!-- STAGE: the emoji clues + the ✓/✗ marker. -->
    <div class="stage">
      <!-- TOP: the emoji clues (moved up so they're out of the way of your thumb). -->
      <section class="clue-zone">
        <!-- #emojis is filled by the JavaScript with one <span> per revealed emoji. -->
        <div class="emoji-card size-lg" id="emojis"></div>
      </section>

      <!-- MIDDLE: the ✓ / ✗ marker. Empty until you answer; the JavaScript fills it. -->
      <!-- MIDDLE: flexible spacer between the emojis and the answer buttons. -->
      <div class="mark-zone"></div>
    </div>

  <!-- BOTTOM: the word buttons + controls. Moved down here (they used to be at the
       top) so they sit within one-handed thumb reach. -->
  <section class="answer-zone">
    <div class="kicker">Which word do these emojis mean?</div>

    <!-- The four answer choices. The JavaScript fills #options with the buttons
         and decides which one is correct. -->
    <div class="options" id="options"></div>

    <!-- Pause button (icon + the word "Pause"), where the Hint button used to be. -->
    <div class="more-wrap">
      <button class="more-btn" id="pause" type="button">
        <span class="pbars"><span></span><span></span></span>Pause
      </button>
    </div>

    <!-- Main action button: it says "Hint" (reveal more emojis, −1 point) until you
         answer, then turns into "Next word". The JavaScript swaps its label. -->
    <div class="controls">
      <button class="next-btn" id="action" type="button">Hint</button>
    </div>

  </section>

    <!-- PAUSED card: one white rounded card covering the whole play area (the
         emojis AND the word buttons). Only "Play" is usable. Hidden until pause. -->
    <div class="pause-panel" id="paused" hidden>
      <div class="go-title">Paused</div>
      <button class="next-btn" id="play" type="button">Play</button>
    </div>
  </div>

  <!-- GAME OVER screen. Hidden until the timer runs out, then the JavaScript
       removes the "hidden" attribute to show it. -->
  <div class="gameover" id="gameover" hidden>
    <div class="go-card">
      <div class="go-title">Game Over</div>
      <div class="go-score">You scored <strong id="finalScore">0</strong></div>
      <button class="next-btn" id="again" type="button">Try again</button>
    </div>
  </div>

  <!-- TUTORIAL overlay: shown once when the page loads. The JavaScript adds a
       labelled arrow pointing at each part of the game; "Got it" starts play. -->
  <div class="tutorial" id="tutorial" hidden>
    <div class="tut-howto">
      <div class="tut-howto-title">How to play</div>
      <p>Match the emoji clues to the right word before time’s up. Hints cost points.</p>
      <div class="tut-tap">Tap anywhere to start</div>
    </div>
  </div>

  <!-- Temporary visible version badge (bottom-left). Bumped each deploy so you can
       tell at a glance whether the page loaded the latest version. Remove later. -->
  <div class="build-badge">v2</div>

  <!-- Everything between <script> and </script> is JavaScript: it controls how
       the page BEHAVES (what happens when you tap the buttons). -->
  <script>
    // ===== THE DATA =====
    // WORDS is the game's content: a list of 100 items. Each item is an object
    // with two properties:
    //   w = the word (a piece of text, e.g. "Beach")
    //   e = an array (list) of 15 emojis that hint at that word
    // "const" means this list is set once and never reassigned.
    const WORDS = [
      { w: "Beach",       e: ["🏖️","🌊","☀️","🏝️","🐚","🩴","👙","⛱️","🌴","🦀","🏄","🌅","🕶️","🍹","🐠"] },
      { w: "Rain",        e: ["🌧️","☔","💧","⛈️","🌦️","☁️","🌂","🥾","🐌","🌈","💦","🌩️","🦆","🏙️","😔"] },
      { w: "Sun",         e: ["☀️","🌞","🌅","🌻","😎","🔥","🏖️","🕶️","🌄","🌇","🌤️","🍦","🏝️","🌡️","⛱️"] },
      { w: "Snow",        e: ["❄️","⛄","🌨️","☃️","🏔️","🧤","🧣","🛷","⛷️","🏂","🥶","🧊","🎿","🌬️","🏒"] },
      { w: "Storm",       e: ["⛈️","🌩️","🌪️","⚡","🌧️","💨","☁️","🌊","⛵","😱","🌀","🔦","🏚️","🌫️","🕯️"] },
      { w: "Rainbow",     e: ["🌈","🌦️","🎨","🦄","🌤️","☔","💜","💙","💚","💛","🧡","❤️","✨","🍭","🌸"] },
      { w: "Ocean",       e: ["🌊","🐳","🐬","🐠","🦈","🐙","🏝️","⛵","🐚","🪸","🧜‍♀️","🌅","🦀","🐋","⚓"] },
      { w: "Mountain",    e: ["⛰️","🏔️","🥾","🧗","🏕️","🌲","🦅","🎿","⛷️","🏂","🌄","🧭","🏞️","🐐","❄️"] },
      { w: "Forest",      e: ["🌲","🌳","🍄","🦌","🦉","🐻","🐿️","🍂","🌿","🏕️","🪵","🐺","🦊","🌱","🥾"] },
      { w: "Volcano",     e: ["🌋","🔥","💥","🌡️","🏔️","💨","🪨","😱","🧨","⛰️","🦖","🌫️","♨️","🏝️","🔴"] },
      { w: "Moon",        e: ["🌙","🌕","🌑","🚀","👨‍🚀","⭐","🌌","🐺","🦉","🌜","🌛","🔭","🌠","🛸","🌚"] },
      { w: "Star",        e: ["⭐","🌟","✨","🌠","🌌","🔭","💫","🌃","🎇","🪐","🌙","🥇","🎬","🤩","🎆"] },
      { w: "Dog",         e: ["🐕","🐶","🦴","🐾","🎾","🦮","🐕‍🦺","🏠","🍖","😃","🐩","🚶","🥏","🐺","❤️"] },
      { w: "Cat",         e: ["🐈","🐱","🐾","🧶","🐟","😸","🥛","🐈‍⬛","😻","🏠","🐭","😼","🪀","🌙","😹"] },

    // ===== GRAB THE PAGE ELEMENTS =====
    // document.getElementById("x") finds the element with id="x" in the HTML
    // above, so we can read or change it from JavaScript.
    const optionsEl = document.getElementById("options");   // holds the 4 choice buttons
    const emojisEl  = document.getElementById("emojis");    // the emoji card
    const actionBtn = document.getElementById("action");    // main button: "Hint" -> "Next word"

    const timerEl   = document.getElementById("timer");     // the countdown in the HUD

    // ===== SETTINGS (change these to tune the game) =====
    const START      = 3;    // how many emojis show when a word first appears
    const STEP       = 3;    // how many more emojis each "Hint" tap reveals
    const CHOICES    = 4;    // how many answer options to show (1 correct + 3 decoys)
    const MAX_POINTS = 5;    // points a word is worth with no hints used
    const GAME_TIME  = 30;   // seconds on the clock for the whole game

    // ===== GAME STATE (values that change as you play) =====
    // "let" (unlike "const") means the value can be reassigned later.
    let current    = -1;          // index (into WORDS) of the word being guessed
    let shuffled   = [];          // the current word's 15 emojis, in a shuffled order
    let revealed   = START;       // how many of those emojis are currently visible
    let answered   = false;       // has the player picked an option this round yet?
    let queue      = [];          // shuffled word indices still to show in this pass
    let wordPoints = MAX_POINTS;  // points the current word is worth right now (5, minus hints)
    let score      = 0;           // total points earned so far (shown top-left)
    let timeLeft   = GAME_TIME;   // seconds remaining on the clock
    let timerId    = null;        // handle for the countdown so we can stop it

    // Return a shuffled COPY of an array (the original list is left untouched).
    // This is the Fisher–Yates shuffle: walk from the end, swapping each item
    // with a random earlier one. We shuffle so the first 3 emojis shown are
    // random each time, not always the same three.
    function shuffle(arr) {
      const a = arr.slice();                            // make a copy so we don't change WORDS
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));  // random index from 0 to i
        [a[i], a[j]] = [a[j], a[i]];                    // swap the two items
      }
      return a;
    }

    // Choose which emoji size to use based on how many are showing, so that more
    // emojis => smaller size and they still fit. Returns a CSS class name.
    function sizeClass(n) {
      if (n <= 3) return "size-lg";   // 1–3 emojis: big
      if (n <= 6) return "size-md";   // 4–6 emojis: medium
      return "size-sm";               // 7–15 emojis: small
    }

    // Redraw the emoji card and the "More emojis" button to match the current
    // state. Called any time something changes — this is the heart of the UI.
    function render() {
      // Set the card's size class (which controls emoji font size via the CSS).
      emojisEl.className = "emoji-card " + sizeClass(revealed);

      // Empty the card, then add one <span> for each emoji we want to show.
      emojisEl.innerHTML = "";
      shuffled.slice(0, revealed).forEach(function (em) { // take the first `revealed` emojis
        const span = document.createElement("span");
        span.className = "emoji";
        span.textContent = em;
        emojisEl.appendChild(span);                       // put it inside the card
      });

      // Update the main button ("Hint" / "Next word").
      updateActionButton();
    }

    // The single main button is "Hint" before you answer and "Next word" after.
    // As "Hint" it greys out once every emoji has been revealed (no hints left).
    function updateActionButton() {
      if (answered) {
        actionBtn.textContent = "Next word →";
        actionBtn.disabled = false;
      } else {
        actionBtn.textContent = "Hint";
        actionBtn.disabled = (shuffled.length - revealed) <= 0;
      }
    }

    // Build the four answer choices for a given correct word. Returns an array of
    // word-indices: the correct one plus three random decoys, all shuffled so the
    // correct answer isn't always in the same spot.
    function buildChoices(answerIdx) {
      // Every word index except the correct one, shuffled; keep the first three.
      const decoys = shuffle(WORDS.map(function (_, i) { return i; })
                              .filter(function (i) { return i !== answerIdx; }))
                     .slice(0, CHOICES - 1);
      return shuffle(decoys.concat(answerIdx));   // add the answer back, shuffle positions
    }

    // Draw the four option buttons for the current word.
    function renderOptions() {
      optionsEl.innerHTML = "";
      buildChoices(current).forEach(function (idx) {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.type = "button";
        btn.textContent = WORDS[idx].w;
        btn.dataset.idx = idx;                     // remember which word this button is
        btn.addEventListener("click", function () { onAnswer(idx); });
        optionsEl.appendChild(btn);
      });
    }

    // Handle a tapped answer: show ✓ or ✗, color the buttons, then lock everything
    // except the "Next word" button.
    function onAnswer(chosenIdx) {
      if (answered) return;                        // ignore extra taps once answered
      answered = true;

      const correct = (chosenIdx === current);

      // Scoring: a correct answer earns the word's current value (5 minus the
      // hints used); a wrong answer earns nothing.
      if (correct) {
        score += wordPoints;
        updateScore();
      }

      // Color the buttons and disable every option.
      Array.prototype.forEach.call(optionsEl.children, function (btn) {
        const idx = Number(btn.dataset.idx);
        btn.disabled = true;
        if (idx === current) btn.classList.add("correct");        // always reveal the answer
        else if (idx === chosenIdx) btn.classList.add("wrong");   // and flag a wrong pick
      });

      updateActionButton();                        // the main button turns into "Next word"
    }

    // Start a fresh round: take the next word from the shuffled queue, build new
    // choices, reset clues to 3, clear the marker. Runs on "Next word", the Space
    // key, and once at startup.
    function nextWord() {
      // Refill and reshuffle the queue once all 100 words have been shown, so
      // every word appears exactly once per pass, then the order changes.
      if (queue.length === 0) {
        queue = shuffle(WORDS.map(function (_, i) { return i; }));
      }
      current = queue.pop();   // take the next word index off the queue

      answered = false;
      wordPoints = MAX_POINTS;               // a fresh word is worth the full 5 points
      // The main button becomes "Hint" again via render() -> updateActionButton().

      shuffled = shuffle(WORDS[current].e);  // shuffle this word's 15 emojis
      revealed = START;                      // show just 3 to begin with
      renderOptions();                       // draw the four choices
      render();                              // draw the emojis + hint button
    }

    // Use a hint: reveal STEP (3) more emojis (never past 15) and drop this word's
    // value by 1 point (never below 0). Ignored once the round has been answered.
    function useHint() {
      if (answered) return;
      revealed = Math.min(revealed + STEP, shuffled.length);
      wordPoints = Math.max(0, wordPoints - 1);
      render();
    }

    // Write the current total score into the top-left HUD.
    function updateScore() {
      scoreEl.textContent = "★ " + score;
    }

    // ===== THE TIMER =====
    // Update the clock display, and turn it red in the last 5 seconds.
    function updateTimer() {
      timerEl.textContent = "⏱ " + timeLeft;
      timerEl.classList.toggle("low", timeLeft <= 5);
    }

    // Tick once per second. When the clock reaches 0, stop and show Game Over.
    function tick() {
      timeLeft--;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimer();
        clearInterval(timerId);
        endGame();
        return;
      }
      updateTimer();
    }

    // Show the Game Over overlay with the final score.
    function endGame() {
      finalScoreEl.textContent = score;
      gameoverEl.hidden = false;
    }

    // The Paused panel only covers the emojis, so the answer buttons below stay
    // visible — we must also block them while paused. We snapshot each control's
    // disabled state on pause and restore it on resume.
    let pauseSnapshot = null;
    function pausedControls() {
      // the four options plus the main Hint/Next button
      return Array.prototype.slice.call(optionsEl.children).concat([actionBtn]);
    }
    function freezeControls() {
      const controls = pausedControls();
      pauseSnapshot = controls.map(function (c) { return c.disabled; });
      controls.forEach(function (c) { c.disabled = true; });
    }
    function thawControls() {
      if (!pauseSnapshot) return;
      pausedControls().forEach(function (c, i) { c.disabled = pauseSnapshot[i]; });
      pauseSnapshot = null;
    }

    // Pause: stop the countdown, cover the emojis with the Paused panel, and block
    // every control except "Play".
    function pauseGame() {
      if (!gameoverEl.hidden) return;   // nothing to pause once the game is over
      if (!pausedEl.hidden) return;     // already paused
      clearInterval(timerId);           // freeze the clock exactly where it is
      timerId = null;
      freezeControls();                 // block the still-visible answer buttons
      pausedEl.hidden = false;          // show the panel over the emojis
    }

    // Play: uncover the emojis, restore the buttons, and restart the countdown from
    // where it stopped (timeLeft was never changed, so no time is lost or added).
    function resumeGame() {
      pausedEl.hidden = true;
      thawControls();
      timerId = setInterval(tick, 1000);
    }

    // Set up a fresh board (score, clock, first word) WITHOUT starting the timer.
    function resetBoard() {
      if (timerId) clearInterval(timerId);   // stop any previous countdown
      timerId = null;
      score = 0;
      timeLeft = GAME_TIME;
      queue = [];                            // force a fresh reshuffle of all 100 words
      gameoverEl.hidden = true;
      pausedEl.hidden = true;                // clear any leftover Paused overlay
      pauseSnapshot = null;                  // and any stale saved control states
      updateScore();
      updateTimer();
      nextWord();
    }

    // Start the countdown ticking.
    function beginTimer() {
      if (timerId) clearInterval(timerId);
      timerId = setInterval(tick, 1000);     // run tick() every 1000ms (1 second)
    }

    // "Try again" restarts a whole game immediately (no tutorial the second time).
    function startGame() {
      resetBoard();
      beginTimer();
    }

    // ===== TUTORIAL (shown once, on page load) =====
    // Each entry: which element to point at, which side the callout sits on, and
    // the label text. (No callout for the visitor counter, on purpose.)
    const TUTORIAL = [
      { target: "#score",   dir: "below", text: "Your points" },
      { target: "#timer",   dir: "below", text: "Time left" },
      { target: "#emojis",  dir: "above", text: "Emoji clues" },
      { target: "#options", dir: "above", text: "Tap the matching word" },
      { target: "#pause",   dir: "above", text: "Pause" },
      { target: "#action",  dir: "below", text: "Hint (−1 pt) — becomes “Next word” after you answer" }
    ];
    // Build one callout (label + arrow) for each entry.
    TUTORIAL.forEach(function (cfg) {
      const el = document.createElement("div");
      el.className = "callout";
      const arrow = document.createElement("span");
      arrow.className = "callout-arrow";
      el.appendChild(arrow);
      el.appendChild(document.createTextNode(cfg.text));
      tutorialEl.appendChild(el);
      cfg.el = el;
      cfg.arrow = arrow;
    });

    // Position one callout next to its target, clamped to stay on screen, with the
    // arrow pointing back at the target's center.
    function placeCallout(cfg) {
      const target = document.querySelector(cfg.target);
      if (!target) return;
      const el = cfg.el, arrow = cfg.arrow, r = target.getBoundingClientRect();
      const vw = window.innerWidth, vh = window.innerHeight, gap = 12, pad = 8;
      el.className = "callout dir-" + cfg.dir;
      el.style.left = "0px"; el.style.top = "0px";      // reset so we can measure size
      const w = el.offsetWidth, h = el.offsetHeight;
      if (cfg.dir === "below" || cfg.dir === "above") {
        const cx = r.left + r.width / 2;
        const left = Math.max(pad, Math.min(cx - w / 2, vw - pad - w));
        const top = cfg.dir === "below" ? r.bottom + gap : r.top - gap - h;
        el.style.left = left + "px"; el.style.top = top + "px";
        arrow.style.left = Math.max(10, Math.min(cx - left, w - 10)) + "px";
      } else {
        const cy = r.top + r.height / 2;
        const top = Math.max(pad, Math.min(cy - h / 2, vh - pad - h));
        const left = cfg.dir === "left" ? r.left - gap - w : r.right + gap;
        el.style.left = Math.max(pad, Math.min(left, vw - pad - w)) + "px"; el.style.top = top + "px";
        arrow.style.top = Math.max(10, Math.min(cy - top, h - 10)) + "px";
      }
    }
    function positionCallouts() { TUTORIAL.forEach(placeCallout); }

    function showTutorial() {
      tutorialEl.hidden = false;
      positionCallouts();
    }
    function dismissTutorial() {
      tutorialEl.hidden = true;
      beginTimer();                          // the clock only starts now
    }

    // ===== HOOK THE BUTTONS UP =====
    // addEventListener("click", fn) means "run function fn whenever this is clicked".
    // The main button does one of two things depending on whether you've answered.
    actionBtn.addEventListener("click", function () {
      if (answered) nextWord();   // after answering it's "Next word"
      else useHint();             // before answering it's "Hint"
    });
    againBtn.addEventListener("click", startGame);   // "Try again" restarts everything
    pauseBtn.addEventListener("click", pauseGame);   // the "Pause" button (now in the answer area)
    playBtn.addEventListener("click", resumeGame);   // "Play" resumes
    tutorialEl.addEventListener("click", dismissTutorial);    // tap anywhere on the overlay starts the game
    window.addEventListener("resize", function () {  // keep the callouts aligned
      if (!tutorialEl.hidden) positionCallouts();
    });

    // Also let the Space key trigger "Next word" (but not on the Game Over screen).
    // e.preventDefault() stops the page from also scrolling when Space is pressed.
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.key === " ") {
        e.preventDefault();
        if (!tutorialEl.hidden) return;   // ignore Space during the tutorial
        if (!gameoverEl.hidden) return;   // ignore Space while Game Over is showing
        if (!pausedEl.hidden) return;     // ignore Space while paused
        if (!answered) return;            // must answer before Space can advance
        nextWord();
      }
    });

    // ===== START =====
    // On load, set up the board and show the one-time tutorial. The countdown
    // starts only when the player taps "Got it".
    resetBoard();
    showTutorial();
  </script>
</body>
</html>

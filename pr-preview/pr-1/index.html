<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Guess</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
    }
    .card {
      background: var(--panel);
      padding: 3rem 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 32rem;
      width: 90%;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.25rem;
      letter-spacing: 0.05em;
    }
    .accent { color: var(--accent); }
    p { color: var(--muted); line-height: 1.6; }
    .tag {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Word <span class="accent">Guess</span></h1>
    <p>
      You're looking at a <strong>preview build</strong>. The live site on
      <code>main</code> still shows the baseline &mdash; this is what the PR
      preview URL looks like before we merge. Gameplay gets built into this
      shell next.
    </p>
    <span class="tag">Preview build &mdash; PR</span>
  </main>
</body>
</html>

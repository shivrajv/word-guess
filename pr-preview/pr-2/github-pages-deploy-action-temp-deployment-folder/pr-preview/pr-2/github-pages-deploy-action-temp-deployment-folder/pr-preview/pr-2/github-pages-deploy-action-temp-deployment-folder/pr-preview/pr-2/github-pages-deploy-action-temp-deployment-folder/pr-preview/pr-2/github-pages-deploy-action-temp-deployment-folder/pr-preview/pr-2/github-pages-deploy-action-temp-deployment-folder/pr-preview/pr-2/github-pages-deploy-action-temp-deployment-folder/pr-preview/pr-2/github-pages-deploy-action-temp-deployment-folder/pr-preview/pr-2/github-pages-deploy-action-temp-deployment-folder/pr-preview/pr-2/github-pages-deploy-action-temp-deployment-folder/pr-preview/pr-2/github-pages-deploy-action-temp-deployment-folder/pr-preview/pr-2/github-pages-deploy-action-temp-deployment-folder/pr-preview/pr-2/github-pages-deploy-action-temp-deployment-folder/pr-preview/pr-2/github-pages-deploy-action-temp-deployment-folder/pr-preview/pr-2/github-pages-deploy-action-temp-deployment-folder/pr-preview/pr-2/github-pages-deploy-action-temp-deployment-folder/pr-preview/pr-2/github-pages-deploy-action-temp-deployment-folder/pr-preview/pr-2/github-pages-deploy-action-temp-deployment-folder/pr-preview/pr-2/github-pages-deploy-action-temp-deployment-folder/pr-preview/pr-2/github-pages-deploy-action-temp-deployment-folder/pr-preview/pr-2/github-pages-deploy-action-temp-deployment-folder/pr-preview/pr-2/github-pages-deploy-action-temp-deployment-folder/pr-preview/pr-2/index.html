<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Word Guess — Emoji Edition</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --ink: #1f2430;
      --muted: #7b8494;
      --accent: #6366f1;
      --accent-ink: #ffffff;
      --shadow: 0 12px 40px rgba(31, 36, 48, 0.10);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Top: the word */
    .word-zone {
      flex: 0 0 auto;
      padding: 2.5rem 1.25rem 1.25rem;
      text-align: center;
    }
    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .word {
      font-size: clamp(2.2rem, 9vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.05;
      word-break: break-word;
    }

    /* Middle: spacer / count */
    .middle {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Bottom: the 3 emoji clues */
    .emoji-zone {
      flex: 0 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    .emoji-card {
      max-width: 32rem;
      margin: 0 auto 1rem;
      background: var(--card);
      border-radius: 1.25rem;
      box-shadow: var(--shadow);
      padding: 1.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(0.4rem, 3vw, 1.5rem);
    }
    .emoji {
      line-height: 1;
      user-select: none;
    }
    /* emoji size scales down as more clues are revealed */
    .emoji-card.size-lg .emoji { font-size: clamp(3rem, 15vw, 5rem); }
    .emoji-card.size-md .emoji { font-size: clamp(2.5rem, 10vw, 3.5rem); }
    .emoji-card.size-sm .emoji { font-size: clamp(1.9rem, 7vw, 2.75rem); }

    .more-wrap {
      max-width: 32rem;
      margin: 0 auto 1.25rem;
      display: flex;
      justify-content: center;
      min-height: 2.4rem;
    }
    .more-btn {
      appearance: none;
      cursor: pointer;
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.55rem 1.4rem;
      border-radius: 999px;
      transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
    }
    .more-btn:hover { background: var(--accent); color: var(--accent-ink); }
    .more-btn:active { transform: translateY(1px) scale(0.99); }
    .controls {
      max-width: 32rem;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    .next-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.85rem 2.25rem;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      transition: transform 0.08s ease, box-shadow 0.15s ease;
    }
    .next-btn:hover { box-shadow: 0 10px 26px rgba(99, 102, 241, 0.45); }
    .next-btn:active { transform: translateY(1px) scale(0.99); }
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 0.9rem;
    }
  </style>
</head>

      { w: "Angry",       e: ["😠","😡","🤬","💢","👿","🔥","😤","🌋","🗯️","✊","💥","😾","🖤","⚡","🥊"] },
      { w: "Sleep",       e: ["😴","💤","🛏️","🌙","🛌","🥱","🌛","🧸","🌃","⏰","🦉","🌟","🛋️","🕯️","🌜"] },
      { w: "Ghost",       e: ["👻","💀","🎃","🕸️","🏚️","😱","⚰️","🌫️","🕯️","🔮","🪦","🦇","😨","🌙","🫥"] },
      { w: "Magic",       e: ["🪄","✨","🧙","🔮","🎩","🐇","🌟","🃏","🧚","💫","🕯️","🧿","🌈","🦄","🎆"] },
    ];

    const wordEl    = document.getElementById("word");
    const emojisEl  = document.getElementById("emojis");
    const counterEl = document.getElementById("counter");
    const nextBtn   = document.getElementById("next");

    const moreBtn = document.getElementById("more");

    const START = 3;   // emojis shown when a word first appears
    const STEP  = 3;   // emojis revealed per "More emojis" tap

    let current = -1;
    let shuffled = [];   // this word's 15 emojis in a shuffled order
    let revealed = START;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sizeClass(n) {
      if (n <= 3) return "size-lg";
      if (n <= 6) return "size-md";
      return "size-sm";
    }

    function render() {
      emojisEl.className = "emoji-card " + sizeClass(revealed);
      emojisEl.innerHTML = "";
      shuffled.slice(0, revealed).forEach(function (em) {
        const span = document.createElement("span");
        span.className = "emoji";
        span.textContent = em;
        emojisEl.appendChild(span);
      });

      const remaining = shuffled.length - revealed;
      if (remaining > 0) {
        moreBtn.style.display = "";
        moreBtn.textContent = "＋ More emojis (" + remaining + " left)";
      } else {
        moreBtn.style.display = "none";   // all 15 shown → button disappears
      }

      counterEl.textContent = "Word " + (current + 1) + " of " + WORDS.length;
    }

    function nextWord() {
      let idx = Math.floor(Math.random() * WORDS.length);
      if (WORDS.length > 1) {
        while (idx === current) idx = Math.floor(Math.random() * WORDS.length);
      }
      current = idx;
      wordEl.textContent = WORDS[idx].w;
      shuffled = shuffle(WORDS[idx].e);
      revealed = START;
      render();
    }

    function moreEmojis() {
      revealed = Math.min(revealed + STEP, shuffled.length);
      render();
    }

    nextBtn.addEventListener("click", nextWord);
    moreBtn.addEventListener("click", moreEmojis);
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.key === " ") {
        e.preventDefault();
        nextWord();
      }
    });

    nextWord();
  </script>
